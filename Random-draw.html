<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>随机抽签</title>
<style>
*{box-sizing:border-box;font-family:system-ui, sans-serif;}
body{max-width:500px;margin:30px auto;padding:0 16px;background:#f7f8fa;}
.card{background:white;padding:24px;border-radius:16px;box-shadow:0 2px 12px #00000012;}
h2{margin-top:0;text-align:center;color:#222;}
.form-item{margin-bottom:16px;}
label{display:block;margin-bottom:6px;font-weight:500;color:#333;}
input,textarea{width:100%;padding:10px 12px;border:1px solid #ddd;border-radius:8px;font-size:16px;}
textarea{min-height:140px;resize:vertical;}
button{width:100%;padding:12px;border:none;border-radius:8px;background:#2563eb;color:white;font-size:16px;cursor:pointer;margin-top:8px;}
button:hover{background:#1d4ed8;}
.desc{margin-top:16px;color:#666;font-size:14px;line-height:1.5;}
</style>
</head>
<body>
<div class="card">
  <h2>随机抽签</h2>
  <div class="form-item">
    <label>候选列表（一行一个）</label>
    <textarea id="listText" placeholder="张三&#10;李四&#10;王五">张三
李四
王五
赵六</textarea>
  </div>
  <div class="form-item">
    <label>抽取数量</label>
    <input id="drawCount" type="number" value="1" min="1">
  </div>
  <button id="drawBtn">开始抽签</button>
  <div class="form-item" style="margin-top:16px;">
    <label>抽到结果</label>
    <textarea id="result" readonly></textarea>
  </div>
  <button id="copyBtn" style="background:#059669;">复制结果</button>
  <div class="desc">
    本地随机抽签，数据不会上传服务器。抽取不重复。
  </div>
</div>

<script>
const listEl = document.getElementById('listText');
const countEl = document.getElementById('drawCount');
const resultEl = document.getElementById('result');
const drawBtn = document.getElementById('drawBtn');
const copyBtn = document.getElementById('copyBtn');

drawBtn.onclick = ()=>{
  const raw = listEl.value.split("\n").map(i=>i.trim()).filter(Boolean);
  let num = parseInt(countEl.value);
  if(num <1) num =1;
  if(num>raw.length) num = raw.length;

  // 洗牌算法
  const arr = [...raw];
  for(let i=arr.length-1;i>0;i--){
    const j = Math.floor(Math.random()*(i+1));
    [arr[i],arr[j]] = [arr[j],arr[i]];
  }
  const picked = arr.slice(0,num);
  resultEl.value = picked.join("\n");
};

copyBtn.onclick = async ()=>{
  try{
    await navigator.clipboard.writeText(resultEl.value);
    alert("复制成功");
  }catch(e){
    alert("复制失败");
  }
};
</script>
</body>
</html>
